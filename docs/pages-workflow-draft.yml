name: Deploy to GitHub Pages (DRAFT — DO NOT ENABLE)

# 说明：
# 本工作流为草案，仅用于在 knowledge-test-kit 发布 tag 并完成本仓库集成测试后启用。
# 现阶段请勿将本文件移动到 .github/workflows/。启用前必须：
#   1. 确认 ../knowledge-test-kit 已发布 v0.x 稳定 tag；
#   2. 在本仓库根添加 package.json 集成入口或 submodule；
#   3. 本地跑通 npm run build 并产出 dist/；
#   4. 修改下方 KIT_VERSION 与 base path。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  KIT_VERSION: "TODO"
  SITE_BASE: "/ml-compiler-knowledge-test/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content
        uses: actions/checkout@v4

      - name: Checkout knowledge-test-kit
        uses: actions/checkout@v4
        with:
          repository: TODO/knowledge-test-kit
          ref: ${{ env.KIT_VERSION }}
          path: .kit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .kit/package-lock.json

      - name: Install kit
        working-directory: .kit
        run: npm ci

      - name: Validate content
        working-directory: .kit
        run: node ./scripts/validate.mjs --config ../knowledge-test.config.json

      - name: Build site
        working-directory: .kit
        env:
          BASE_PATH: ${{ env.SITE_BASE }}
        run: node ./scripts/build.mjs --config ../knowledge-test.config.json --out ../dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
